# 三体模拟经营游戏配置文件

game:
  title: "三体文明"
  resolution: [1280, 720]
  fps: 60
  fullscreen: false        # 是否全屏
  resizable: true          # 是否可调整窗口大小
  center: true             # 窗口居中显示

simulation:
  time_scale: 1.0        # 时间流逝速度
  time_scale_min: 0.1    # 最小时间倍率
  time_scale_max: 10.0   # 最大时间倍率
  accuracy: "medium"     # 积分精度
  initial_paused: false

# 行星环境参数（可微调）
environment:
  thermal_inertia: 0.08         # 温度变化速率因子（越小温度变化越慢）
  diffusion_rate: 0.15          # 大气热扩散速率（0=无扩散, 1=瞬间均匀）
  dark_side_scatter: 0.25       # 背光面大气散射系数（越大夜间越温和）
  rotation_speed: 15.0          # 行星自转速度（°/游戏天）
  target_start_temp: 20.0       # 开局目标全球平均温度（°C）
  target_peak_light: 0.85       # 开局最亮区域的显示光照百分比

camera:
  fov: 500
  default_distance: 500
  move_speed: 5
  rotation_sensitivity: 0.005
  zoom_speed: 10

colors:
  star_1: [255, 200, 100]    # 橙色
  star_2: [100, 200, 255]    # 蓝色
  star_3: [255, 100, 100]    # 红色
  earth: [100, 255, 150]
  background: [10, 10, 20]
  ui_bg: [30, 30, 50]
  ui_border: [80, 80, 120]
  ui_text: [200, 200, 255]

stars:
  - name: "Alpha"
    mass: 1000.0
    position: [0, 0, 0]
    velocity: [0, 0, 0]
    color: [255, 200, 100]
    radius: 25.0
  - name: "Beta"
    mass: 800.0
    position: [200, 0, 0]
    velocity: [0, 0, 2]
    color: [100, 200, 255]
    radius: 20.0
  - name: "Gamma"
    mass: 600.0
    position: [-100, 0, 100]
    velocity: [0, 0, -1.5]
    color: [255, 100, 100]
    radius: 15.0

# 初始资源
initial_entities:
  population: 100
  resources:
    - name: "iron"
      amount: 200
      max_storage: 5000
    - name: "copper"
      amount: 30
      max_storage: 3000
    - name: "rare_mineral"
      amount: 0
      max_storage: 1000
    - name: "algae_fuel"
      amount: 100
      max_storage: 3000
    - name: "fossil_fuel"
      amount: 0
      max_storage: 3000
    - name: "electricity"
      amount: 0
      max_storage: 500
    - name: "food"
      amount: 1000
      max_storage: 8000

# ═══════════════════ 人口参数 ═══════════════════
population:
  food_per_person_per_day: 0.1          # 每人每天食物消耗
  base_growth_per_breeder: 0.05         # 每个生育人口每天增长人数
  natural_growth_rate: 0.001            # 闲置人口微量自然增长（每人每天）
  starvation_threshold: 0.5             # 食物满足度低于此值开始饥荒减员
  starvation_rate: 0.01                 # 饥荒减员速率
  dehydrate_food_consumption_rate: 0.2  # 脱水状态下食物消耗倍率
  dehydrate_keep_fraction: 0.01         # 脱水时保留在活跃状态的最低人口比例

# ═══════════════════ 建筑环境伤害系数 ═══════════════════
damage_rates:
  heat_damage_coefficient: 0.02         # 高温伤害系数 (excess * coefficient * dt)
  cold_damage_coefficient: 0.01         # 低温伤害系数
  radiation_damage_coefficient: 0.03    # 辐射伤害系数

# ═══════════════════ 脱水机制 ═══════════════════
dehydrate:
  output_multiplier: 0.1                # 脱水时非关键建筑产出倍率
  exempt_types:                         # 脱水时不受产出惩罚的建筑类型
    - storage_vault
    - large_storage_vault
    - shelter
    - deep_shelter

# ═══════════════════ 科研系统 ═══════════════════
research:
  basic_population_divisor: 500.0       # 每500人口产出1点基础科研/天
  institute_output_per_day: 1.0         # 研究院每满员天产出基础科研点
  laboratory_output_per_day: 2.0        # 实验室每满员天产出应用科研点
  academy_output_per_day: 1.0           # 科学院每满员天产出理论科研点
  dehydrate_multiplier: 0.1             # 脱水时科研产出倍率
  ema_alpha: 0.05                       # 科研产出速率EMA平滑系数
  automation_multiplier: 1.3            # 自动化科技解锁后的全局倍率

# ═══════════════════ 库存人口环境损耗 ═══════════════════
storage_damage:
  # 极端温度损耗
  extreme_cold_threshold: -80           # 极端低温阈值(℃)
  extreme_heat_threshold: 100           # 极端高温阈值(℃)
  extreme_base_loss_rate: 0.005         # 极端温度基础损耗率/天
  extreme_excess_coefficient: 0.04      # 极端温度超量系数
  # 轻微温度损耗
  mild_cold_threshold: -10              # 轻微低温阈值
  mild_heat_threshold: 60               # 轻微高温阈值
  mild_loss_coefficient: 0.002          # 轻微温度最大损耗系数/天
  # 辐射损耗
  radiation_high_threshold: 5           # 高辐射阈值
  radiation_low_threshold: 2            # 低辐射阈值
  radiation_high_base_rate: 0.003       # 高辐射基础损耗率/天
  radiation_high_excess_coefficient: 0.02  # 高辐射超量系数
  radiation_low_coefficient: 0.001      # 低辐射最大损耗系数/天
  # 暴露人口损耗（脱水时未入库的人口）
  exposed_extreme_loss_rate: 0.1        # 极端环境暴露损耗率/天
  exposed_harsh_loss_rate: 0.02         # 恶劣环境暴露损耗率/天
  exposed_radiation_high_rate: 0.05     # 高辐射暴露损耗率/天
  exposed_radiation_low_rate: 0.01      # 低辐射暴露损耗率/天

